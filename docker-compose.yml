# Local single-host deployment. Provision dependencies and model weights separately.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      EXPO_HOST: "0.0.0.0"
      EXPO_PORT: "8090"
      EXPO_DATA_DIR: /data
      EXPO_OLLAMA_HOST: http://host.docker.internal:11434
      EXPO_CORS_ORIGINS: http://localhost:8090,http://127.0.0.1:8090
      EXPO_CHAT_MODEL: qwen3.5:9b
      EXPO_VISION_MODEL: paddleocr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - expo_data:/data
    restart: unless-stopped
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  expo_data:
