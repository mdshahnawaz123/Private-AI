<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expo Design AI - Dashboard</title>
<link rel="stylesheet" href="/ui/fonts.css?v=2">
<style>
:root{--bg:#0a0f1a;--panel:#0f1828;--card:#111c30;--border:#1e2c45;--border2:#28395a;--text:#e8eef7;--muted:#8ea0ba;--faint:#5f6f87;--accent:#2f6bff;--green:#35d07f;--amber:#f5b73d;--violet:#8a6cff;--cyan:#31d0c5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;font-size:13px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:12px;margin-top:3px}
.btn{background:#16233b;border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent)}
main{padding:22px 28px 60px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;opacity:0;transform:translateY(8px);animation:rise .5s ease forwards}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent))}
.kpi .l{color:var(--muted);font-size:11.5px;line-height:1.35;min-height:30px}
.kpi .v{font-size:24px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .c{color:var(--faint);font-size:11px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:14px}
.cell{opacity:0;animation:rise .5s ease forwards}
h2{font-size:14px;margin:28px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tbl{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:auto}
.tbl .t{padding:10px 14px;font-weight:600;border-bottom:1px solid var(--border)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;background:#0d1626;position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.empty,.err{padding:40px;text-align:center;color:var(--muted)}
@keyframes rise{to{opacity:1;transform:none}}
@media (max-width:640px){header,main{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.kpi,.cell{animation:none;opacity:1;transform:none}}
.ask{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
.ask input{flex:1;min-width:260px;background:var(--card);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px}
.hint{color:var(--muted);font-size:12px}
.cell{background:transparent}
.cbar{display:flex;gap:6px;margin-top:6px}
.cbar input{flex:1;background:#0d1626;border:1px solid var(--border);color:var(--text);border-radius:7px;padding:5px 9px;font-size:11.5px}
.btn.sm{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.5;cursor:default}
.filt{float:right;background:#0d1626;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:400;width:180px}
th[data-j]{cursor:pointer;user-select:none}
th[data-s]:not([data-s=""])::after{content:" " attr(data-s);color:var(--accent)}
#toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16233b;border:1px solid var(--border2);padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw}
@media print{.noprint,header .btn{display:none!important}}
@media (max-width:640px){.filt{float:none;display:block;width:100%;margin-top:6px}}
</style>
</head>
<body>
<header>
  <div><h1 id="title">Dashboard</h1><div class="sub" id="sub">Loading...</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="replay">Replay animation</button><button class="btn" id="save">Save to Reports</button><button class="btn primary" onclick="window.print()">Print / PDF</button></div>
</header>
<main id="main"><div class="empty">Building dashboard from the file...</div></main>
<div id="toast"></div>
<script src="/ui/vendor_components/chart_renderer.js?v=6"></script>
<script src="/ui/vendor_components/expo_motion.js?v=2"></script>
<script>
(async function(){
  const q = new URLSearchParams(location.search);
  const project = q.get('project') || '', filename = q.get('filename') || '', att = q.get('att') || '', saved = q.get('saved') || '';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isNum = s => /^[-+]?[\d,]*\.?\d+%?$/.test(String(s).replace(/\s/g,''));
  const num = s => { const v = parseFloat(String(s).replace(/[,%\s]/g,'')); return isNaN(v) ? null : v; };
  const colors = ['#2f6bff','#35d07f','#8a6cff','#f5b73d','#31d0c5','#f2585f','#ff8d3b','#60a5fa'];
  const $ = id => document.getElementById(id);
  const main = $('main');
  const api = (url, opt) => fetch(url, opt).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(r.status === 401 ? 'Please sign in to Expo Design AI first, then reopen this page.' : (j.detail || ('Error ' + r.status))); return j; });
  const P = '/projects/' + encodeURIComponent(project);
  let d, source = {filename, attachment_id: att ? +att : 0}, title = filename;
  try {
    if (saved) {
      const m = await api(P + '/dashboards/' + encodeURIComponent(saved));
      d = m.data; title = m.title; source = d.source || {};
      $('sub').textContent = project + ' - saved dashboard by ' + m.created_by + ' on ' + m.created_at + ' - from ' + (m.source || 'a file');
    } else {
      d = await api(P + '/dashboard?' + (att ? 'attachment_id=' + encodeURIComponent(att) : 'filename=' + encodeURIComponent(filename)));
      title = d.filename || filename;
      $('sub').textContent = project + ' - ' + d.table_count + ' tables found - every value computed from the file (built in ' + d.built_in_s + ' s)';
    }
  } catch (e) { main.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; $('sub').textContent = ''; return; }
  $('title').textContent = title; document.title = title + ' - Dashboard';
  d.charts = d.charts || []; d.kpis = d.kpis || []; d.tables = d.tables || [];

  let html = '';
  if (d.kpis.length) html += '<div class="kpis">' + d.kpis.map((k, i) => `<div class="kpi" style="--c:${colors[i % colors.length]};animation-delay:${i * 70}ms"><div class="l">${esc(k.label)}</div><div class="v" data-v="${k.value}">0</div><div class="c">${k.count > 1 ? 'Total of ' + k.count + ' rows' : esc(k.context)}</div></div>`).join('') + '</div>';
  html += `<div class="ask noprint"><input id="askIn" placeholder="Add a chart: e.g. &quot;total cost by building&quot;, &quot;GFA by land use as a pie&quot;, &quot;top 10 items by amount&quot;" maxlength="400"><button class="btn primary" id="askBtn">Add chart</button><span id="askMsg" class="hint"></span></div>`;
  html += '<h2>Charts</h2><div class="grid" id="charts"></div>';
  if (d.tables.length) html += '<h2>Data</h2>' + d.tables.map((t, ti) => `<div class="tbl"><div class="t">${esc(String(t.title).replace('Sheet: ',''))} <span style="color:var(--faint);font-weight:400">- showing ${t.rows.length} of ${t.total_rows} rows</span><input class="filt noprint" data-t="${ti}" placeholder="Filter rows…"></div><table data-t="${ti}"><thead><tr>${t.columns.map((c, j) => `<th data-j="${j}" title="Click to sort">${esc(c)}</th>`).join('')}</tr></thead><tbody></tbody></table></div>`).join('');
  main.innerHTML = html;
  const counters = () => document.querySelectorAll('.kpi .v').forEach(el => window.ExpoMotion.countUp(el, +el.dataset.v, 1400));
  counters();

  // ---- tables: filter + click-to-sort
  const tstate = d.tables.map(() => ({f: '', j: -1, asc: true}));
  const drawTable = ti => {
    const t = d.tables[ti], st = tstate[ti];
    let rows = t.rows.filter(r => !st.f || r.some(c => String(c || '').toLowerCase().includes(st.f)));
    if (st.j >= 0) rows = rows.slice().sort((a, b) => { const x = num(a[st.j]), y = num(b[st.j]); const c = (x != null && y != null) ? x - y : String(a[st.j] || '').localeCompare(String(b[st.j] || '')); return st.asc ? c : -c; });
    document.querySelector(`table[data-t="${ti}"] tbody`).innerHTML = rows.map(r => '<tr>' + t.columns.map((_, j) => `<td class="${isNum(r[j] || '') ? 'n' : ''}">${esc(r[j] || '')}</td>`).join('') + '</tr>').join('') || `<tr><td colspan="${t.columns.length}" style="color:var(--faint)">No matching rows</td></tr>`;
    document.querySelectorAll(`table[data-t="${ti}"] th`).forEach(th => th.dataset.s = (+th.dataset.j === st.j) ? (st.asc ? '▲' : '▼') : '');
  };
  d.tables.forEach((_, ti) => drawTable(ti));
  document.querySelectorAll('.filt').forEach(inp => inp.oninput = () => { tstate[+inp.dataset.t].f = inp.value.trim().toLowerCase(); drawTable(+inp.dataset.t); });
  document.querySelectorAll('th[data-j]').forEach(th => th.onclick = () => { const ti = +th.closest('table').dataset.t, st = tstate[ti], j = +th.dataset.j; st.asc = st.j === j ? !st.asc : false; st.j = j; drawTable(ti); });

  // ---- charts: each card can be edited ("make it a pie", "top 5", "show labels") or removed
  const grid = $('charts');
  const addCard = (spec, i, animate) => {
    const cell = document.createElement('div'); cell.className = 'cell'; cell.style.animationDelay = animate ? (200 + i * 120) + 'ms' : '0ms';
    cell._spec = spec;
    const bar = document.createElement('div'); bar.className = 'cbar noprint';
    bar.innerHTML = `<input placeholder="Change this chart: pie, top 5, show labels…" maxlength="200"><button class="btn sm" data-a="edit">Apply</button><button class="btn sm" data-a="del" title="Remove chart">✕</button>`;
    const host = document.createElement('div');
    cell.appendChild(host); cell.appendChild(bar); grid.appendChild(cell);
    const draw = (sp, delay) => { host.innerHTML = ''; const w = window.ExpoChartRenderer.render(sp, host); if (w) { w.style.margin = '0'; window.ExpoMotion.attach(w, {delay: delay || 0}); } };
    draw(spec, animate ? 250 + i * 160 : 0);
    const inp = bar.querySelector('input');
    const apply = async () => {
      const ins = inp.value.trim(); if (!ins) return;
      inp.disabled = true;
      try {
        const r = await api('/api/visualize/edit', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({spec: cell._spec, instruction: ins, project, question: cell._spec.title || ''})});
        if (r.spec) { cell._spec = r.spec; d.charts[[...grid.children].indexOf(cell)] = r.spec; draw(r.spec, 0); inp.value = ''; dirty(); }
        else toast(r.message || 'That change could not be applied - try "pie chart", "top 5" or "sort descending".');
      } catch (e) { toast(e.message); } finally { inp.disabled = false; }
    };
    bar.querySelector('[data-a="edit"]').onclick = apply; inp.onkeydown = e => { if (e.key === 'Enter') apply(); };
    bar.querySelector('[data-a="del"]').onclick = () => { const k = [...grid.children].indexOf(cell); d.charts.splice(k, 1); cell.remove(); dirty(); };
  };
  d.charts.forEach((spec, i) => addCard(spec, i, true));
  if (!d.charts.length) $('askMsg').textContent = 'No chart could be built automatically - ask for one above.';

  const canAsk = !!(source.filename || source.attachment_id);
  if (!canAsk) { $('askIn').disabled = true; $('askIn').placeholder = 'The source file of this saved dashboard is not available to you'; $('askBtn').disabled = true; }
  const ask = async () => {
    const question = $('askIn').value.trim(); if (!question) return;
    $('askBtn').disabled = true; $('askMsg').textContent = 'Building chart from the file…';
    try {
      const r = await api(P + '/dashboard/chart', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.assign({question}, source))});
      if (!r.spec) { $('askMsg').textContent = r.message || 'No table fits that question.'; return; }
      d.charts.push(r.spec); addCard(r.spec, 0, false); grid.lastChild.scrollIntoView({behavior: 'smooth', block: 'center'});
      $('askIn').value = ''; $('askMsg').textContent = 'Added. Values computed from ' + (r.spec.sources && r.spec.sources[0] ? r.spec.sources[0].filename : 'the file') + '.'; dirty();
    } catch (e) { $('askMsg').textContent = e.message; } finally { $('askBtn').disabled = false; }
  };
  $('askBtn').onclick = ask; $('askIn').onkeydown = e => { if (e.key === 'Enter') ask(); };

  function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000); }
  function dirty() { $('save').textContent = 'Save to Reports *'; }
  $('save').onclick = async () => {
    const name = prompt('Name this dashboard (project members will see it under Reports):', title);
    if (name === null) return;
    try {
      const body = {title: name.trim() || title, source: title, data: Object.assign({}, d, {source})};
      const r = await api(P + '/dashboards', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
      $('save').textContent = 'Saved ✓'; toast('Saved as "' + r.title + '" - open it any time from Reports.');
    } catch (e) { toast(e.message); }
  };
  $('replay').onclick = () => { counters(); document.querySelectorAll('[data-motion="Replay"]').forEach((b, i) => setTimeout(() => b.click(), i * 160)); };
})();
</script>
</body>
</html>
