<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenCompany - PDF Drawing Review Engine</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; background: #1e1e1e; color: #fff; }
        .sidebar { width: 300px; background: #252526; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .main { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        .toolbar { height: 40px; background: #333333; display: flex; align-items: center; padding: 0 10px; gap: 5px; border-bottom: 1px solid #222; }
        .toolbar button, .toolbar select { background: transparent; color: #ccc; border: 1px solid transparent; padding: 5px 8px; cursor: pointer; border-radius: 3px; font-size: 13px; }
        .toolbar button:hover { background: #444; border-color: #555; }
        .toolbar button.active { background: #007acc; color: white; border-color: #007acc; }
        
        .viewer-container { flex: 1; overflow: auto; position: relative; background: #111; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
        .pdf-page-container { position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .pdf-canvas { display: block; cursor: crosshair; }
        .drawing-canvas { position: absolute; top: 0; left: 0; cursor: crosshair; pointer-events: none; }
        .drawing-canvas.interactive { pointer-events: auto; }
        
        .panel { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .panel-header { padding: 10px; background: #2d2d30; border-bottom: 1px solid #333; font-weight: bold; font-size: 14px; display:flex; justify-content: space-between; }
        .panel-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
        
        .metadata-item { margin-bottom: 8px; }
        .metadata-label { color: #888; font-size: 11px; text-transform: uppercase; }
        .metadata-val { font-weight: 500; }
        
        .comment-item { background: #333; padding: 8px; border-radius: 4px; margin-bottom: 10px; border-left: 3px solid #007acc; cursor: pointer; }
        .comment-item:hover { background: #3a3a3a; }
        .comment-head { display: flex; justify-content: space-between; margin-bottom: 5px; color: #888; font-size: 11px; }
        .comment-text { font-size: 13px; margin-bottom: 5px; }
        .comment-status { font-size: 11px; font-weight: bold; padding: 2px 5px; border-radius: 3px; }
        .status-OPEN { background: #d9534f; color: white; }
        .status-IN_PROGRESS { background: #f0ad4e; color: white; }
        .status-CLOSED { background: #5cb85c; color: white; }
        
        #fileInput { display: none; }
        
        .temp-div { position: absolute; border: 2px solid red; pointer-events: none; }
        .temp-text { position: absolute; color: red; font-size: 16px; pointer-events: none; white-space: nowrap; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="panel">
            <div class="panel-header">Drawing Metadata</div>
            <div class="panel-content" id="metadataPanel">
                <div class="metadata-item"><div class="metadata-label">File</div><div class="metadata-val" id="metaFile">Not available</div></div>
                <div class="metadata-item"><div class="metadata-label">Title</div><div class="metadata-val" id="metaTitle">Not available</div></div>
                <div class="metadata-item"><div class="metadata-label">Drawing Number</div><div class="metadata-val" id="metaNum">Not available</div></div>
                <div class="metadata-item"><div class="metadata-label">Revision</div><div class="metadata-val" id="metaRev">Not available</div></div>
                <div class="metadata-item"><div class="metadata-label">Date</div><div class="metadata-val" id="metaDate">Not available</div></div>
                <button onclick="document.getElementById('fileInput').click()" style="width:100%; margin-top:15px; padding:8px; background:#007acc; color:white; border:none; border-radius:3px; cursor:pointer;">Open PDF Document</button>
                <input type="file" id="fileInput" accept=".pdf">
            </div>
        </div>
        <div class="panel" style="border-top: 1px solid #333;">
            <div class="panel-header">
                Comments 
                <select id="filterStatus" style="background:#222;color:white;border:none;font-size:11px;">
                    <option value="ALL">All</option>
                    <option value="OPEN">Open</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="CLOSED">Closed</option>
                </select>
            </div>
            <div class="panel-content" id="commentList">
                <div style="color:#888; text-align:center; margin-top:20px;">No comments yet.</div>
            </div>
        </div>
    </div>
    
    <div class="main">
        <div class="toolbar">
            <!-- Nav -->
            <button id="btnPrev">Prev Page</button>
            <span style="font-size:13px; margin:0 5px;">Page <span id="pageNum">0</span> / <span id="pageCount">0</span></span>
            <button id="btnNext">Next Page</button>
            <span style="border-left:1px solid #555; height:20px; margin:0 5px;"></span>
            
            <!-- Zoom -->
            <button id="btnZoomOut">-</button>
            <select id="zoomSelect">
                <option value="page-fit">Fit Page</option>
                <option value="page-width">Fit Width</option>
                <option value="0.5">50%</option>
                <option value="0.75">75%</option>
                <option value="1" selected>100%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
            </select>
            <button id="btnZoomIn">+</button>
            <button id="btnPan" class="tool-btn" data-tool="pan">Pan</button>
            <span style="border-left:1px solid #555; height:20px; margin:0 5px;"></span>
            
            <!-- Tools -->
            <button class="tool-btn active" data-tool="select">Select</button>
            <button class="tool-btn" data-tool="text">Text</button>
            <button class="tool-btn" data-tool="comment">Comment</button>
            <button class="tool-btn" data-tool="line">Line</button>
            <button class="tool-btn" data-tool="arrow">Arrow</button>
            <button class="tool-btn" data-tool="cloud">Cloud</button>
            <button class="tool-btn" data-tool="rectangle">Rect</button>
            <button class="tool-btn" data-tool="circle">Circle</button>
            <button class="tool-btn" data-tool="freehand">Pen</button>
            <button class="tool-btn" data-tool="highlight">Highlight</button>
            <button class="tool-btn" data-tool="strikeout">Strike</button>
            <button class="tool-btn" data-tool="underline">Underline</button>
            <button class="tool-btn" data-tool="stamp">Stamp</button>
            <button class="tool-btn" data-tool="eraser">Eraser</button>
            <span style="border-left:1px solid #555; height:20px; margin:0 5px;"></span>
            
            <!-- History -->
            <button id="btnUndo">Undo</button>
            <button id="btnRedo">Redo</button>
            <span style="border-left:1px solid #555; height:20px; margin:0 5px;"></span>
            
            <!-- Export -->
            <button id="btnExportExcel" style="background:#217346;color:white;">Export Excel</button>
            <button id="btnExportPdf" style="background:#cb2127;color:white;">Export PDF</button>
        </div>
        
        <div class="viewer-container" id="viewerContainer">
            <div class="pdf-page-container" id="pdfContainer">
                <canvas id="pdfCanvas" class="pdf-canvas"></canvas>
                <canvas id="drawCanvas" class="drawing-canvas interactive"></canvas>
            </div>
        </div>
    </div>

    <script src="review.js"></script>
</body>
</html>
